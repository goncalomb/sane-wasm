name: test

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: crazy-max/ghaction-github-runtime@v4.0.0
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5.1.2
      - run: npm ci
      - run: npm run build
      - run: npm run test
        env:
          TEST_SKIP_PKG_VERSION: true
